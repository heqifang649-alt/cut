name: V2 status contract
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test tests/classic-multisource-contract.test.mjs tests/classic-multisource.test.mjs
        env:
          CUTFLOW_TEST_FFMPEG: ffmpeg
          CUTFLOW_TEST_FFPROBE: ffprobe
